[project]
name = "jira-kb-mcp"
version = "0.1.0"
description = "MCP agent that indexes a Jira project into a local knowledge base and helps locate past solutions via semantic + keyword search."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Alejandro Braganca" }
]
keywords = ["mcp", "jira", "rag", "knowledge-base", "agent"]

dependencies = [
    "mcp[cli]==2.1.1",
    "lancedb==0.25.3",
    "pyarrow==25.0.1",
    "fastembed==0.8.0",
    "requests==2.34.2",
    "typer==0.27.2",
    "python-dotenv==1.2.3",
    "rich==15.0.0",
    "scikit-learn==1.9.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "responses==0.26.3",
]

[project.scripts]
jira-kb = "jira_kb_mcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_kb_mcp"]
